<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction</title>
    <script>
        // the girl intro only plays when coming from index.html (Get Started), not on reload
        document.documentElement.classList.toggle('skip-intro', sessionStorage.getItem('fromHome') !== '1');
        sessionStorage.removeItem('fromHome');
    </script>
    <link rel="stylesheet" href="font-awesome-icon/css/all.min.css">


    <style>
        @font-face {
            font-family: 'Poppins';
            src: url('Poppins/Poppins-Bold.ttf') format('truetype');
            font-weight: 400;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
            overflow-x: none;
        }

        [hidden] {
            display: none !important;
        }

        :root {
            --vanilla-cream: #FFF9EF;
            /* main background */
            --pastel-pink: #F4A5C5;
            /* Chiikawa Pink */
            --pastel-aqua: #A9CBE5;
            /* Hachiware Blue */
            --pastel-green: #C8DDB5;
            /* Meadow Green */
            --soft-charcoal: #6B5147;
            /* Outline Brown (text, headings) */
            --ocean-blue: #F4A5C5;
            /* primary buttons, loader bar, plane */
            --border: rgba(0, 100, 200, 0.18);
            --tint-pink: rgba(244, 165, 197, 0.28);
            --tint-aqua: rgba(169, 203, 229, 0.32);
            --tint-green: rgba(200, 221, 181, 0.42);
        }

        .container-fluid {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--vanilla-cream);
            padding: 1.8rem;
        }

        .container-fluid.lessons-mode {
            align-items: flex-start;
        }

        /* ---------- Tour girl intro ---------- */
        .parent-box {
            display: flex;
            gap: 1rem;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .parent-box .box {
            width: 100px;
            height: 170px;
            background-image: url('tour-girl.png');
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            opacity: 0;
            animation: slideInGirl 0.7s ease-out 0.2s forwards;
        }

        .parent-box .message {
            width: 280px;
            height: 130px;
            background-color: white;
            border-radius: 10px;
            padding: 1rem;
            font-size: 13.5px;
            opacity: 0;
            transform-origin: left center;
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.9s forwards;
        }

        @keyframes slideInGirl {
            from {
                opacity: 0;
                transform: translateX(-40px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.6) translateY(10px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .sub-parent-box {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .parent-box .right-box {
            display: inline-flex;
            flex-direction: column;
            gap: 1rem;
        }

        .parent-box .right-box p {
            color: var(--soft-charcoal);
        }

        .parent-box .right-box button {
            padding: 7px 20px;
            border-radius: 10px;
            background-color: var(--ocean-blue);
            color: #ffffff;
            border: none;
            font-size: 12.5px;
            width: 130px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.3rem;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0s linear 0.4s;
        }

        .parent-box .right-box button .fa {
            font-size: 12px;
        }

        .parent-box .right-box button.show {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.4s ease, visibility 0s linear 0s;
        }

        .parent-box.leaving {
            opacity: 0;
            transform: translateY(-20px);
        }

        .skip-intro .sub-parent-box {
            display: none;
        }

        /* ---------- Lessons ---------- */
        .lessons {
            display: none;
            width: min(1080px, 100%);
            min-width: 0;
            color: var(--soft-charcoal);
        }

        .lessons.show {
            display: block;
            opacity: 0;
            animation: fadeUp 0.5s ease forwards;
        }

        .lessons h2,
        .lessons h3,
        .lessons h4 {
            font-weight: 400;
        }

        .lessons p,
        .lessons li {
            line-height: 1.75;
        }

        /* highlighter-style emphasis (the font only has one weight) */
        .lessons b {
            font-weight: 400;
            background: linear-gradient(transparent 58%, rgba(244, 165, 197, 0.5) 58%);
        }

        .hub-head {
            text-align: center;
            margin: 0.6rem 0 1.8rem;
        }

        .hub-head h2 {
            font-size: 34px;
            line-height: 1.2;
        }

        .hub-head p {
            font-size: 14.5px;
            margin-top: 0.4rem;
        }

        .module-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 20px;
        }

        .mod-card {
            display: flex;
            flex-direction: column;
            text-align: left;
            background: #ffffff;
            border: none;
            border-radius: 26px;
            overflow: hidden;
            cursor: pointer;
            color: var(--soft-charcoal);
            /* box-shadow: 0 14px 30px rgba(107, 81, 71, 0.12); */
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .mod-card:hover,
        .mod-card:focus-visible {
            transform: translateY(-5px);
            box-shadow: 0 20px 36px rgba(107, 81, 71, 0.18);
        }

        .mod-top {
            background: var(--c);
            padding: 20px 22px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mod-num {
            font-size: 13px;
            letter-spacing: 0.08em;
            background: #ffffff;
            border-radius: 20px;
            padding: 4px 14px;
        }

        .mod-count {
            font-size: 12.5px;
        }

        .mod-body {
            padding: 20px 22px 22px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .mod-subject {
            font-size: 12.5px;
            opacity: 0.8;
        }

        .mod-body h3 {
            font-size: 19px;
            line-height: 1.35;
        }

        .mod-teacher {
            font-size: 12.5px;
            opacity: 0.8;
        }

        .mod-desc {
            font-size: 13px;
            line-height: 1.6;
            opacity: 0.85;
        }

        .mod-go {
            margin-top: auto;
            align-self: flex-start;
            padding: 9px 22px;
            border-radius: 28px;
            background: var(--pastel-pink);
            font-size: 13.5px;
        }

        .back-btn,
        .pager button {
            font-size: 13.5px;
            border-radius: 28px;
            padding: 10px 22px;
            cursor: pointer;
            border: 2px solid var(--pastel-pink);
            background: #ffffff;
            color: var(--soft-charcoal);
            transition: transform 0.15s ease, background 0.2s ease;
        }

        .back-btn:hover,
        .pager button:hover:not(:disabled) {
            transform: translateY(-2px);
            background: var(--tint-pink);
        }

        .pager button.next {
            background: var(--pastel-pink);
        }

        .pager button:disabled {
            opacity: 0.35;
            cursor: default;
        }

        .reader-top {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px 22px;
            margin-bottom: 1.2rem;
        }

        .reader-title {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .badge {
            flex: none;
            width: 54px;
            height: 54px;
            border-radius: 18px;
            display: grid;
            place-items: center;
            font-size: 22px;
            background: var(--c);
        }

        .reader-title h2 {
            font-size: 22px;
            line-height: 1.25;
        }

        .reader-title p {
            font-size: 12.5px;
            opacity: 0.8;
            line-height: 1.4;
        }

        .reader-body {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 22px;
            align-items: start;
        }

        .topic-nav {
            position: sticky;
            top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #ffffff;
            border-radius: 22px;
            padding: 12px;
            box-shadow: 0 10px 24px rgba(107, 81, 71, 0.1);
        }

        .topic-nav button {
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
            border: none;
            background: transparent;
            border-radius: 14px;
            padding: 9px 10px;
            font-size: 13px;
            line-height: 1.35;
            color: var(--soft-charcoal);
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .topic-nav button:hover {
            background: var(--tint-pink);
        }

        .topic-nav button .n {
            flex: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 12px;
            background: var(--vanilla-cream);
        }

        .topic-nav button.active {
            background: var(--pastel-pink);
        }

        .topic-nav button.active .n {
            background: var(--soft-charcoal);
            color: #ffffff;
        }

        .topic-panel {
            background: #ffffff;
            border-radius: 26px;
            padding: 1.8rem;
            box-shadow: 0 14px 30px rgba(107, 81, 71, 0.12);
            min-width: 0;
        }

        .progress {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            margin-bottom: 1.1rem;
        }

        .progress .bar {
            flex: 1;
            height: 8px;
            background: var(--vanilla-cream);
            border-radius: 8px;
            overflow: hidden;
        }

        .progress .bar i {
            display: block;
            height: 100%;
            width: 0;
            background: var(--pastel-pink);
            border-radius: 8px;
            transition: width 0.35s ease;
        }

        .topic-panel>h3 {
            font-size: 26px;
            line-height: 1.25;
            margin-bottom: 1rem;
        }

        #tBody {
            animation: fadeUp 0.35s ease;
        }

        #tBody p {
            font-size: 14.5px;
            margin-bottom: 0.9rem;
        }

        #tBody .sub {
            font-size: 17px;
            margin: 1.4rem 0 0.7rem;
        }

        .callout {
            background: var(--vanilla-cream);
            border-left: 5px solid var(--pastel-pink);
            border-radius: 6px 18px 18px 6px;
            padding: 14px 18px;
            margin: 0 0 1.1rem;
        }

        .callout .label {
            display: inline-block;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: var(--pastel-pink);
            border-radius: 12px;
            padding: 2px 10px;
            margin-bottom: 6px;
        }

        .callout p {
            margin: 0;
        }

        ul.dots,
        ol.numbered {
            list-style: none;
            margin: 0 0 1rem;
            display: grid;
            gap: 8px;
        }

        ul.dots li {
            position: relative;
            padding-left: 24px;
            font-size: 14.5px;
        }

        ul.dots li::before {
            content: "";
            position: absolute;
            left: 4px;
            top: 0.72em;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--pastel-pink);
        }

        ol.numbered {
            counter-reset: n;
        }

        ol.numbered li {
            counter-increment: n;
            display: flex;
            gap: 14px;
            align-items: flex-start;
            background: var(--vanilla-cream);
            border-radius: 18px;
            padding: 12px 16px;
            font-size: 14.5px;
        }

        ol.numbered li::before {
            content: counter(n);
            flex: none;
            width: 30px;
            height: 30px;
            margin-top: 1px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: var(--soft-charcoal);
            color: #ffffff;
            font-size: 13px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 12px;
            margin-bottom: 1rem;
        }

        .mini {
            background: var(--vanilla-cream);
            border-radius: 18px;
            padding: 14px 16px;
            border-top: 4px solid var(--c, var(--pastel-pink));
        }

        .mini h4 {
            font-size: 15px;
            margin-bottom: 4px;
        }

        #tBody .mini p {
            font-size: 13.5px;
            line-height: 1.65;
            margin: 0;
        }

        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 1rem;
        }

        .panel {
            border-radius: 20px;
            padding: 16px 18px 8px;
            background: var(--bg);
        }

        .panel h4 {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 1rem;
        }

        .chip {
            font-size: 13px;
            background: var(--bg, var(--tint-pink));
            border-radius: 20px;
            padding: 6px 14px;
        }

        .dept {
            background: var(--vanilla-cream);
            border-radius: 18px;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .dept summary {
            list-style: none;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            font-size: 15.5px;
        }

        .dept summary::-webkit-details-marker {
            display: none;
        }

        .dept summary::after {
            content: "+";
            flex: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: var(--pastel-pink);
        }

        .dept[open] summary::after {
            content: "\2212";
        }

        .dept-body {
            padding: 0 18px 8px;
        }

        .dept-body h4 {
            font-size: 13px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin: 6px 0 6px;
            opacity: 0.8;
        }

        .reception {
            text-align: center;
            margin: 0.4rem 0 1rem;
        }

        .reception .core {
            display: inline-block;
            background: var(--soft-charcoal);
            color: #ffffff;
            border-radius: 28px;
            padding: 12px 34px;
            font-size: 17px;
            letter-spacing: 0.06em;
        }

        .reception .arrows {
            font-size: 22px;
            margin: 4px 0;
        }

        .reception .chips {
            justify-content: center;
        }

        .cycle {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 1rem;
        }

        .stage {
            background: var(--vanilla-cream);
            border-radius: 20px;
            overflow: hidden;
        }

        .stage .head {
            background: var(--c);
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
        }

        .stage .head span {
            flex: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #ffffff;
            font-size: 13px;
        }

        .stage ul {
            padding: 12px 14px 6px;
            margin: 0;
        }

        .stage ul li {
            font-size: 13px;
            line-height: 1.5;
        }

        .source {
            font-size: 12px;
            opacity: 0.75;
        }

        .task {
            border: 2px dashed var(--pastel-pink);
            border-radius: 22px;
            padding: 18px 20px 8px;
            margin-bottom: 1rem;
            background: var(--vanilla-cream);
        }

        .task .label {
            display: inline-block;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: var(--pastel-pink);
            border-radius: 12px;
            padding: 2px 10px;
            margin-bottom: 6px;
        }

        .task h3 {
            font-size: 19px;
            margin-bottom: 0.7rem;
        }

        .task ol.numbered li {
            background: #ffffff;
        }

        .pager {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 1.6rem;
            padding-top: 1.2rem;
            border-top: 2px dashed var(--vanilla-cream);
        }

        @media only screen and (max-width: 820px) {
            .reader-body {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .topic-nav {
                position: sticky;
                top: 0;
                z-index: 5;
                flex-direction: row;
                overflow-x: auto;
                border-radius: 18px;
                padding: 8px;
                gap: 6px;
                scrollbar-width: none;
            }

            .topic-nav::-webkit-scrollbar {
                display: none;
            }

            .topic-nav button {
                flex: none;
                white-space: nowrap;
            }

            .cycle {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media only screen and (max-width: 600px) {
            .container-fluid {
                min-height: 100dvh;
                padding: 1.2rem 1.5rem;
            }

            .hub-head h2 {
                font-size: 28px;
            }

            .topic-panel {
                padding: 1.3rem 1.1rem;
                border-radius: 22px;
            }

            .topic-panel>h3 {
                font-size: 22px;
            }

            .two-col {
                grid-template-columns: 1fr;
            }

            .cycle {
                grid-template-columns: 1fr;
            }

            .pager button {
                padding: 10px 16px;
            }
        }

        @media only screen and (max-width: 470px) {
            .parent-box {
                display: flex;
                gap: 0.7rem;
            }

            .parent-box .message {
                width: 260px;
                height: 120px;
            }

            .parent-box .message p {
                font-size: 12.5px;
            }

            .parent-box .right-box button {
                font-size: 11.5px;
            }

            .parent-box .right-box button .fa {
                font-size: 11px;
            }
        }
    </style>

</head>

<body>
    <div class="container-fluid" id="page">
        <div class="sub-parent-box">
            <div class="parent-box">
                <div class="box"></div>
                <div class="right-box">
                    <div class="message">
                        <p id="typed-text"></p>
                    </div>
                    <button>Continue <i class="fa fa-arrow-right"></i></button>
                </div>
            </div>
        </div>

        <section class="lessons" id="lessons">
            <!-- module list -->
            <div id="hubView">
                <div class="hub-head">
                    <h2>Your Lessons</h2>
                    <p>Pick a module to start learning.</p>
                </div>
                <div class="module-grid" id="moduleGrid"></div>
            </div>

            <!-- lesson reader -->
            <div id="readerView" hidden>
                <div class="reader-top">
                    <button class="back-btn" id="backBtn">&larr; All modules</button>
                    <div class="reader-title">
                        <span class="badge" id="rBadge"></span>
                        <div>
                            <h2 id="rTitle"></h2>
                        </div>
                    </div>
                </div>

                <div class="reader-body">
                    <nav class="topic-nav" id="topicNav" aria-label="Lessons in this module"></nav>
                    <article class="topic-panel">
                        <div class="progress">
                            <span id="rCount"></span>
                            <div class="bar"><i id="rBar"></i></div>
                        </div>
                        <h3 id="tTitle"></h3>
                        <div id="tBody"></div>
                        <div class="pager">
                            <button id="prevBtn">&larr; Previous</button>
                            <button id="nextBtn" class="next">Next &rarr;</button>
                        </div>
                    </article>
                </div>
            </div>
        </section>
    </div>

    <script>
        /* ================= girl intro ================= */
        const text = "Welcome to our tourism website! Discover beautiful destinations, plan your perfect trip, and explore the best places with us. Let me be your guide!";
        const el = document.getElementById('typed-text');
        const btn = document.querySelector('.right-box button');
        const parentBox = document.querySelector('.parent-box');
        const subParent = document.querySelector('.sub-parent-box');
        const page = document.getElementById('page');
        const lessonsEl = document.getElementById('lessons');
        let i = 0;

        function type() {
            if (i < text.length) {
                el.textContent += text.charAt(i);
                i++;
                setTimeout(type, 40);
            } else {
                btn.classList.add('show');   // show the button after the last letter
            }
        }

        function showLessons() {
            subParent.style.display = 'none';
            page.classList.add('lessons-mode');
            lessonsEl.classList.add('show');
        }

        if (document.documentElement.classList.contains('skip-intro')) {
            showLessons();   // reload or direct visit: go straight to the lessons
        } else {
            setTimeout(type, 1500);
        }

        btn.addEventListener('click', () => {
            parentBox.classList.add('leaving');
            setTimeout(showLessons, 500);
        });

        /* ================= lesson content ================= */
        const h = {
            p: t => `<p>${t}</p>`,
            sub: t => `<h3 class="sub">${t}</h3>`,
            callout: (label, t) => `<div class="callout"><span class="label">${label}</span><p>${t}</p></div>`,
            list: items => `<ul class="dots">${items.map(x => `<li>${x}</li>`).join('')}</ul>`,
            steps: items => `<ol class="numbered">${items.map(x => `<li><div>${x}</div></li>`).join('')}</ol>`,
            cards: (items, color) => `<div class="cards">${items.map(([t, d]) => `<div class="mini"${color ? ` style="--c:${color}"` : ''}><h4>${t}</h4><p>${d}</p></div>`).join('')}</div>`,
            chips: (items, bg) => `<div class="chips">${items.map(x => `<span class="chip"${bg ? ` style="--bg:${bg}"` : ''}>${x}</span>`).join('')}</div>`,
            task: (title, body) => `<div class="task"><span class="label">Activity</span><h3>${title}</h3>${body}</div>`,
            dept: (name, does, liaise) => `<details class="dept"><summary>${name}</summary><div class="dept-body"><h4>What they do</h4><p>${does}</p>${liaise ? `<h4>Liaising with the Front Office</h4>${h.list(liaise)}` : ''}</div></details>`
        };

                    <span class="mod-go">Start to review &rarr;</span>
                </div>
            </button>`).join('');

        moduleGrid.addEventListener('click', e => {
            const card = e.target.closest('.mod-card');
            if (card) openModule(+card.dataset.i);
        });

        function openModule(n) {
            current = MODULES[n];
            document.getElementById('rBadge').textContent = current.num;
            document.getElementById('rBadge').style.setProperty('--c', current.color);
            document.getElementById('rTitle').textContent = current.title;
            // document.getElementById('rSub').textContent = 'Module ' + current.num + ' \u00B7 ' + current.subject;
            topicNav.innerHTML = current.topics.map((t, k) =>
                `<button data-k="${k}"><span class="n">${k + 1}</span><span>${t.title}</span></button>`).join('');
            hubView.hidden = true;
            readerView.hidden = false;
            showTopic(0, false);
            window.scrollTo({ top: 0 });
        }

        function showTopic(k, scroll = true) {
            topicIndex = k;
            const t = current.topics[k];
            tTitle.textContent = t.title;
            tBody.innerHTML = t.html;
            const first = tBody.querySelector('details');
            if (first) first.open = true;
            tBody.style.animation = 'none'; void tBody.offsetWidth; tBody.style.animation = '';

            [...topicNav.children].forEach((b, n) => b.classList.toggle('active', n === k));
            const active = topicNav.children[k];
            if (active && topicNav.scrollWidth > topicNav.clientWidth) {
                topicNav.scrollTo({ left: active.offsetLeft - 12, behavior: 'smooth' });
            }

            document.getElementById('rCount').textContent = 'Lesson ' + (k + 1) + ' of ' + current.topics.length;
            document.getElementById('rBar').style.width = ((k + 1) / current.topics.length * 100) + '%';
            prevBtn.disabled = k === 0;
            nextBtn.innerHTML = k === current.topics.length - 1 ? 'Back to modules' : 'Next &rarr;';
            if (scroll) readerView.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        topicNav.addEventListener('click', e => {
            const b = e.target.closest('button');
            if (b) showTopic(+b.dataset.k);
        });
        prevBtn.addEventListener('click', () => { if (topicIndex > 0) showTopic(topicIndex - 1); });
        nextBtn.addEventListener('click', () => {
            if (topicIndex < current.topics.length - 1) showTopic(topicIndex + 1);
            else showHub();
        });

        function showHub() {
            readerView.hidden = true;
            hubView.hidden = false;
            window.scrollTo({ top: 0 });
        }
        document.getElementById('backBtn').addEventListener('click', showHub);
    </script>
</body>

</html>
